<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1, viewport-fit=cover">
<title>RADAR</title>
<meta name="theme-color" content="#14213D">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4"></script>
<style>
  :root{
    --bg:#F4F6F9; --surface:#FFFFFF; --surface-2:#EEF1F6; --border:#DDE2EA;
    --ink:#1B2333; --ink-muted:#66707F; --ink-faint:#98A1AF;
    --accent:#14213D; --accent-soft:#E4E8F1;
    --green:#1E8E5A; --green-soft:#E3F5EC;
    --amber:#B5820A; --amber-soft:#FBF0D6;
    --red:#C63E31; --red-soft:#FBE4E1;
    --radius:10px;
  }
  *{box-sizing:border-box;}
  html,body{height:100%;}
  body{margin:0;background:var(--bg);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;overflow:hidden;}
  ::-webkit-scrollbar{height:8px;width:8px;}
  ::-webkit-scrollbar-thumb{background:#C7CCD6;border-radius:4px;}

  #login-screen{height:100%;display:flex;align-items:center;justify-content:center;}
  .login-box{width:340px;padding:36px 32px;background:var(--surface);border:1px solid var(--border);border-radius:14px;}
  .login-box h1{font-size:22px;margin:0 0 4px;color:var(--accent);letter-spacing:.5px;}
  .login-box p{color:var(--ink-muted);font-size:13px;margin:0 0 22px;}
  .field{margin-bottom:14px;}
  .field label,.flabel{display:block;font-size:11px;color:var(--ink-muted);margin-bottom:6px;font-weight:600;}
  input[type=text],input[type=email],input[type=password],input[type=number],input[type=date],textarea,select{
    width:100%;background:var(--surface-2);border:1px solid var(--border);color:var(--ink);
    padding:9px 11px;border-radius:7px;font-size:14px;font-family:inherit;outline:none;
  }
  input:focus,textarea:focus,select:focus{border-color:var(--accent);}
  textarea{resize:vertical;min-height:60px;line-height:1.5;}
  .btn{border:1px solid var(--border);background:var(--surface);color:var(--ink);padding:9px 14px;border-radius:7px;
    cursor:pointer;font-size:13px;font-weight:600;display:inline-flex;align-items:center;gap:6px;}
  .btn:hover{border-color:var(--accent);}
  .btn-primary{background:var(--accent);border-color:var(--accent);color:#fff;}
  .btn-primary:hover{background:#1d2f57;}
  .btn-danger{color:var(--red);}
  .btn-danger:hover{border-color:var(--red);background:var(--red-soft);}
  .btn-block{width:100%;justify-content:center;}
  .btn-ghost{background:transparent;border-color:transparent;color:var(--ink-muted);}
  .btn-sm{padding:5px 10px;font-size:12px;}
  .error-msg{color:var(--red);font-size:12px;margin-top:10px;min-height:14px;}

  #app{display:none;height:100%;flex-direction:column;}
  #app.active{display:flex;}
  #topbar{padding:14px 22px;border-bottom:1px solid var(--border);background:var(--surface);
    display:flex;align-items:center;justify-content:space-between;flex-shrink:0;}
  #topbar h1{font-size:18px;margin:0;color:var(--accent);letter-spacing:.5px;}

  .view{display:none;flex:1;min-height:0;flex-direction:column;overflow-y:auto;}
  .view.active{display:flex;}

  /* home */
  #home-body{padding:20px 22px;max-width:800px;width:100%;margin:0 auto;}
  .section-header{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px;}
  .section-header h3{margin:0;font-size:13px;text-transform:uppercase;letter-spacing:.4px;color:var(--ink-muted);}
  .row-list{display:flex;flex-direction:column;gap:8px;}
  .row-card{background:var(--surface);border:1px solid var(--border);border-radius:10px;padding:12px 14px;
    cursor:pointer;display:flex;align-items:center;justify-content:space-between;gap:10px;}
  .row-card:hover{border-color:var(--accent);}
  .row-card .rtitle{font-size:13.5px;font-weight:700;}
  .row-card .rsub{font-size:11.5px;color:var(--ink-muted);margin-top:2px;}
  .empty-hint{color:var(--ink-faint);font-size:12.5px;padding:14px 2px;}

  /* subview topbar (client / period-detail) */
  .subview-topbar{padding:16px 22px;border-bottom:1px solid var(--border);background:var(--surface);
    display:flex;align-items:flex-start;justify-content:space-between;gap:16px;flex-shrink:0;}
  .subview-topbar .left{display:flex;align-items:flex-start;gap:14px;flex:1;min-width:0;}
  .back-btn{background:none;border:none;color:var(--ink-muted);cursor:pointer;font-size:14px;padding:4px 0;flex-shrink:0;}
  .back-btn:hover{color:var(--accent);}
  .subview-topbar h2{font-size:18px;margin:0;}
  .subview-topbar .sub{font-size:12px;color:var(--ink-muted);margin-top:3px;}
  .subview-actions{display:flex;gap:8px;flex-shrink:0;}

  #client-tabs{padding:0 22px;border-bottom:1px solid var(--border);display:flex;background:var(--surface);flex-shrink:0;overflow-x:auto;}
  .ctab-btn{padding:12px 4px;margin-right:22px;background:none;border:none;color:var(--ink-faint);
    font-size:13px;font-weight:600;cursor:pointer;border-bottom:2px solid transparent;white-space:nowrap;}
  .ctab-btn.active{color:var(--accent);border-color:var(--accent);}
  .ctab-panel{display:none;flex:1;min-height:0;overflow-y:auto;}
  .ctab-panel.active{display:flex;flex-direction:column;}
  .panel-body{padding:20px 22px;max-width:800px;width:100%;margin:0 auto;}

  .card-block{background:var(--surface);border:1px solid var(--border);border-radius:10px;padding:16px;margin-bottom:16px;}
  .summary-text{font-size:13.5px;line-height:1.6;color:var(--ink);}
  .kv-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;}
  .kv-grid .kv-item .kv-label{font-size:10.5px;color:var(--ink-faint);text-transform:uppercase;}
  .kv-grid .kv-item .kv-val{font-size:15px;font-weight:700;margin-top:2px;}

  table.mtable{width:100%;border-collapse:collapse;font-size:13px;}
  table.mtable th{text-align:left;font-size:10.5px;text-transform:uppercase;color:var(--ink-faint);padding:6px 8px;border-bottom:1px solid var(--border);}
  table.mtable td{padding:8px;border-bottom:1px solid var(--surface-2);}
  table.mtable tr:last-child td{border-bottom:none;}
  .dot{display:inline-block;width:9px;height:9px;border-radius:50%;margin-right:6px;vertical-align:middle;}
  .dot-green{background:var(--green);} .dot-amber{background:var(--amber);} .dot-red{background:var(--red);} .dot-gray{background:#C7CCD6;}
  .delta{font-size:11.5px;font-weight:700;}
  .delta-pos{color:var(--green);} .delta-neg{color:var(--red);} .delta-neutral{color:var(--ink-faint);}

  .bullets{display:flex;flex-direction:column;gap:8px;}
  .bullet{background:var(--surface);border:1px solid var(--border);border-left:3px solid var(--amber);border-radius:8px;padding:10px 12px;font-size:13px;line-height:1.5;}

  .view-pills{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:14px;}
  .view-pill{border:1px solid var(--border);background:var(--surface);color:var(--ink-muted);padding:6px 13px;
    border-radius:20px;font-size:12.5px;font-weight:600;cursor:pointer;}
  .view-pill.active{background:var(--accent);border-color:var(--accent);color:#fff;}
  .cadence-pills{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:14px;}
  .cadence-pill{border:1px solid var(--accent);background:var(--surface);color:var(--accent);padding:6px 13px;
    border-radius:20px;font-size:12.5px;font-weight:700;cursor:pointer;}
  .cadence-pill.active{background:var(--accent);color:#fff;}

  .chart-title{font-size:12.5px;font-weight:700;color:var(--ink-muted);margin:0 0 10px;text-transform:uppercase;letter-spacing:.3px;}
  .chart-box{position:relative;height:210px;}
  .charts-grid{display:grid;grid-template-columns:1fr 1fr;gap:16px;}
  @media (max-width:760px){ .charts-grid{grid-template-columns:1fr;} .kv-grid{grid-template-columns:1fr 1fr;} }

  /* marketing entries */
  .entry-row{background:var(--surface);border:1px solid var(--border);border-radius:10px;padding:12px 14px;
    cursor:pointer;display:flex;align-items:center;justify-content:space-between;gap:10px;}
  .entry-row:hover{border-color:var(--accent);}
  .entry-row .etitle{font-size:13.5px;font-weight:700;}
  .entry-row .esub{font-size:11.5px;color:var(--ink-muted);margin-top:2px;}

  .preview-box{background:var(--accent-soft);border:1px solid var(--border);border-radius:8px;padding:9px 12px;font-size:12.5px;color:var(--accent);font-weight:600;margin-bottom:12px;}
  .static-label{font-size:13px;font-weight:700;color:var(--ink);margin-bottom:14px;}

  /* chat */
  #chat-messages{flex:1;overflow-y:auto;padding:18px 22px;display:flex;flex-direction:column;gap:12px;max-width:800px;width:100%;margin:0 auto;}
  .msg{max-width:80%;padding:10px 13px;border-radius:12px;font-size:13.5px;line-height:1.55;white-space:pre-wrap;}
  .msg-user{align-self:flex-end;background:var(--accent);color:#fff;border-bottom-right-radius:3px;}
  .msg-assistant{align-self:flex-start;background:var(--surface);border:1px solid var(--border);border-bottom-left-radius:3px;}
  .msg-typing{align-self:flex-start;color:var(--ink-faint);font-size:12.5px;padding:4px 13px;}
  #chat-input-row{border-top:1px solid var(--border);background:var(--surface);padding:14px 22px;display:flex;gap:10px;flex-shrink:0;}
  #chat-input-row .inner{max-width:800px;width:100%;margin:0 auto;display:flex;gap:10px;}
  #chat-text-input{flex:1;}
  .chat-empty{color:var(--ink-faint);font-size:13px;text-align:center;padding:40px 20px;max-width:420px;margin:0 auto;}
  .chat-context-label{font-size:11px;color:var(--ink-faint);padding:8px 22px 0;max-width:800px;margin:0 auto;width:100%;}

  .overlay{display:none;position:fixed;inset:0;background:rgba(20,25,40,.45);align-items:flex-start;justify-content:center;z-index:50;padding:6vh 16px;overflow-y:auto;}
  .overlay.active{display:flex;}
  .modal{width:480px;max-width:100%;background:var(--surface);border:1px solid var(--border);border-radius:14px;padding:22px;}
  .modal-header{display:flex;align-items:center;justify-content:space-between;margin-bottom:16px;}
  .modal-header h3{font-size:16px;margin:0;}
  .close-x{background:none;border:none;color:var(--ink-faint);font-size:18px;cursor:pointer;}
  .modal-actions{display:flex;justify-content:space-between;margin-top:18px;gap:10px;}
  .modal-actions .right{display:flex;gap:8px;}
  .field-row{margin-bottom:12px;}
  .two-col{display:grid;grid-template-columns:1fr 1fr;gap:10px;}
  .three-col{display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px;}
  @media (max-width:760px){ .modal{width:100%;} .three-col{grid-template-columns:1fr 1fr;} table.mtable{font-size:12px;} }
</style>
</head>
<body>

<div id="login-screen">
  <div class="login-box">
    <h1>RADAR</h1>
    <p>Marketing + comercial por cliente, com gráficos e IA pra conversar sobre o relatório.</p>
    <form id="login-form">
      <div class="field"><label>E-mail</label><input type="email" id="login-email" required autocomplete="username"></div>
      <div class="field"><label>Senha</label><input type="password" id="login-password" required autocomplete="current-password"></div>
      <button type="submit" class="btn btn-primary btn-block">Entrar</button>
      <div class="error-msg" id="login-error"></div>
    </form>
  </div>
</div>

<div id="app">
  <div id="topbar">
    <h1>RADAR</h1>
    <button class="btn btn-ghost" id="signout-btn">Sair</button>
  </div>

  <!-- HOME -->
  <div id="home-view" class="view active">
    <div id="home-body">
      <div class="section-header"><h3>Clientes</h3><button class="btn btn-primary" id="new-client-btn">+ Novo cliente</button></div>
      <div class="row-list" id="clients-list"></div>
    </div>
  </div>

  <!-- CLIENT -->
  <div id="client-view" class="view">
    <div class="subview-topbar">
      <div class="left"><button class="back-btn" data-back="home">← Voltar</button>
        <div><h2 id="client-detail-name"></h2><div class="sub" id="client-detail-niche"></div></div>
      </div>
      <div class="subview-actions">
        <button class="btn" id="edit-client-btn">Editar</button>
        <button class="btn btn-danger" id="delete-client-btn">Excluir</button>
      </div>
    </div>
    <div id="client-tabs">
      <button class="ctab-btn active" data-ctab="periods">Períodos</button>
      <button class="ctab-btn" data-ctab="report">Relatório</button>
      <button class="ctab-btn" data-ctab="chat">Conversar com a IA</button>
    </div>
    <div class="ctab-panel active" id="ctab-periods">
      <div class="panel-body">
        <div id="periods-cadence-pills"></div>
        <div class="section-header"><h3>Períodos</h3><button class="btn btn-primary" id="new-period-btn">+ Novo período</button></div>
        <div class="row-list" id="periods-list"></div>
      </div>
    </div>
    <div class="ctab-panel" id="ctab-report">
      <div class="panel-body" id="report-body"></div>
    </div>
    <div class="ctab-panel" id="ctab-chat" style="flex:1;">
      <div class="chat-context-label" id="chat-context-label"></div>
      <div id="chat-messages"></div>
      <div id="chat-input-row">
        <div class="inner">
          <input type="text" id="chat-text-input" placeholder="Pergunte sobre o relatório atual...">
          <button class="btn btn-primary" id="chat-send-btn">Enviar</button>
        </div>
      </div>
    </div>
  </div>

  <!-- PERIOD DETAIL -->
  <div id="period-detail-view" class="view">
    <div class="subview-topbar">
      <div class="left"><button class="back-btn" data-back="client-periods">← Voltar</button>
        <div><h2 id="period-detail-name"></h2><div class="sub" id="period-detail-dates"></div></div>
      </div>
      <div class="subview-actions">
        <button class="btn" id="edit-period-btn">Editar</button>
        <button class="btn btn-danger" id="delete-period-btn2">Excluir</button>
      </div>
    </div>
    <div class="panel-body">
      <div class="section-header"><h3>Dados comerciais</h3></div>
      <div class="card-block">
        <div class="kv-grid" id="period-commercial-grid"></div>
      </div>
      <div class="section-header"><h3>Marketing por mídia</h3><button class="btn btn-sm" id="new-entry-btn">+ Adicionar mídia</button></div>
      <div class="row-list" id="entries-list"></div>
    </div>
  </div>
</div>

<!-- Modal: cliente -->
<div class="overlay" id="client-modal">
  <div class="modal">
    <div class="modal-header"><h3 id="client-modal-title">Novo cliente</h3><button class="close-x" data-close="client-modal">✕</button></div>
    <div class="field-row"><label class="flabel">Nome</label><input type="text" id="client-name-input" placeholder="Nome do cliente"></div>
    <div class="field-row"><label class="flabel">Nicho / segmento</label><input type="text" id="client-niche-input" placeholder="Ex: Nutricionista, SaaS B2B..."></div>
    <div class="modal-actions"><span></span><div class="right"><button class="btn" data-close="client-modal">Cancelar</button><button class="btn btn-primary" id="save-client-btn">Salvar</button></div></div>
  </div>
</div>

<!-- Modal: período -->
<div class="overlay" id="period-modal">
  <div class="modal">
    <div class="modal-header"><h3 id="period-modal-title">Novo período</h3><button class="close-x" data-close="period-modal">✕</button></div>
    <div id="period-static-label" class="static-label" style="display:none;"></div>
    <div class="field-row"><label class="flabel">Data de início</label><input type="date" id="p-start"></div>
    <div class="preview-box" id="p-preview" style="display:none;"></div>
    <div class="field-row three-col">
      <div><label class="flabel">Qualificados</label><input type="number" id="p-qualified" step="1"></div>
      <div><label class="flabel">Reuniões marcadas</label><input type="number" id="p-meetings-sched" step="1"></div>
      <div><label class="flabel">Reuniões realizadas</label><input type="number" id="p-meetings-held" step="1"></div>
    </div>
    <div class="field-row three-col">
      <div><label class="flabel">Propostas</label><input type="number" id="p-proposals" step="1"></div>
      <div><label class="flabel">Vendas</label><input type="number" id="p-sales" step="1"></div>
      <div><label class="flabel">Receita (R$)</label><input type="number" id="p-revenue" step="0.01"></div>
    </div>
    <div class="field-row"><label class="flabel">Notas (opcional)</label><textarea id="p-notes"></textarea></div>
    <div class="modal-actions"><span></span><div class="right"><button class="btn" data-close="period-modal">Cancelar</button><button class="btn btn-primary" id="save-period-btn">Salvar</button></div></div>
  </div>
</div>

<!-- Modal: entrada de mídia -->
<div class="overlay" id="entry-modal">
  <div class="modal">
    <div class="modal-header"><h3 id="entry-modal-title">Nova mídia</h3><button class="close-x" data-close="entry-modal">✕</button></div>
    <div class="field-row"><label class="flabel">Plataforma</label>
      <select id="entry-platform-input">
        <option value="google_ads">Google Ads</option>
        <option value="meta_ads">Meta Ads</option>
        <option value="tiktok_ads">TikTok Ads</option>
        <option value="chatgpt_ads">ChatGPT Ads</option>
        <option value="outra">Outra</option>
      </select>
    </div>
    <div class="field-row" id="entry-custom-name-row" style="display:none;"><label class="flabel">Nome da plataforma</label><input type="text" id="entry-custom-name-input" placeholder="Ex: LinkedIn Ads"></div>
    <div class="field-row two-col">
      <div><label class="flabel">Investimento (R$)</label><input type="number" id="e-spend" step="0.01"></div>
      <div><label class="flabel">Leads</label><input type="number" id="e-leads" step="1"></div>
    </div>
    <div class="field-row three-col">
      <div><label class="flabel">Impressões</label><input type="number" id="e-impressions" step="1"></div>
      <div><label class="flabel">Cliques</label><input type="number" id="e-clicks" step="1"></div>
      <div><label class="flabel">Visualizações</label><input type="number" id="e-views" step="1"></div>
    </div>
    <div class="modal-actions"><button class="btn btn-danger" id="delete-entry-btn" style="display:none;">Excluir</button><div class="right"><button class="btn" data-close="entry-modal">Cancelar</button><button class="btn btn-primary" id="save-entry-btn">Salvar</button></div></div>
  </div>
</div>

<!-- Modal: confirmação de exclusão -->
<div class="overlay" id="delete-confirm-modal">
  <div class="modal">
    <div class="modal-header"><h3>Confirmar exclusão</h3><button class="close-x" id="delete-confirm-close-x">✕</button></div>
    <p id="delete-confirm-message" style="font-size:13px;color:var(--ink-muted);margin:0 0 14px;line-height:1.5;"></p>
    <div class="field-row"><label class="flabel">Digite <strong style="color:var(--red);">DELETE</strong> para confirmar</label><input type="text" id="delete-confirm-input" placeholder="DELETE" autocomplete="off"></div>
    <div class="modal-actions"><span></span><div class="right"><button class="btn" id="delete-confirm-cancel-btn">Cancelar</button><button class="btn btn-danger" id="delete-confirm-btn" disabled>Excluir</button></div></div>
  </div>
</div>

<script>
/* ========= CONFIG ========= */
const SUPABASE_URL = 'https://deknjziemvbhqjllnysu.supabase.co';
const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImRla25qemllbXZiaHFqbGxueXN1Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODgzMDgyODMsImV4cCI6MjEwMzg4NDI4M30.TqAMowwe2XCRBdy9-cTaxK5o_KzQgzoarYJkTjjNoIo';
const N8N_WEBHOOK_URL = 'COLE_AQUI_A_URL_DO_WEBHOOK_N8N';
const N8N_WEBHOOK_SECRET = 'COLE_AQUI_UM_SEGREDO_QUALQUER';
/* =========================== */

const sb = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

const PLATFORM_LABELS = { google_ads: 'Google Ads', meta_ads: 'Meta Ads', tiktok_ads: 'TikTok Ads', chatgpt_ads: 'ChatGPT Ads', outra: 'Outra' };
const PLATFORM_ORDER = ['google_ads', 'meta_ads', 'tiktok_ads', 'chatgpt_ads'];
const CADENCE_DEFS = [{ key: 'semanal', label: 'Semanal', unit: 'Semana' }, { key: 'quinzenal', label: 'Quinzenal', unit: 'Quinzena' }, { key: 'mensal', label: 'Mensal', unit: 'Mês' }];
const CADENCE_UNIT = { semanal: 'Semana', quinzenal: 'Quinzena', mensal: 'Mês' };

let state = {
  user: null,
  clients: [],
  activeClientId: null,
  periods: [], entriesByPeriod: {},
  activeClientTab: 'periods',
  activeCadence: 'semanal',
  activeReportView: 'overview',
  activePeriodId: null,
  chatMessages: [],
  editingClientId: null, editingPeriodId: null, editingEntryId: null,
};
let activeCharts = [];

/* ---------------- Auth ---------------- */

document.getElementById('login-form').addEventListener('submit', async (e) => {
  e.preventDefault();
  const email = document.getElementById('login-email').value.trim();
  const password = document.getElementById('login-password').value;
  const errEl = document.getElementById('login-error');
  errEl.textContent = '';
  const { data, error } = await sb.auth.signInWithPassword({ email, password });
  if (error) { errEl.textContent = 'Não foi possível entrar. Confira e-mail e senha.'; return; }
  await onAuthed(data.user);
});

document.getElementById('signout-btn').addEventListener('click', async () => {
  await sb.auth.signOut();
  location.reload();
});

  }));
}

function addDays(dateStr, days) { const d = new Date(dateStr + 'T00:00:00'); d.setDate(d.getDate() + days); return d.toISOString().slice(0, 10); }
function computeEndDate(startStr, cadence) {
  const d = new Date(startStr + 'T00:00:00');
  if (cadence === 'semanal') d.setDate(d.getDate() + 6);
  else if (cadence === 'quinzenal') d.setDate(d.getDate() + 13);
  else if (cadence === 'mensal') { d.setMonth(d.getMonth() + 1); d.setDate(d.getDate() - 1); }
  return d.toISOString().slice(0, 10);
}

/* ---------------- Platform helpers ---------------- */

function platformKeyOf(entry) { return entry.platform === 'outra' ? ('outra:' + (entry.custom_platform_name || '').trim().toLowerCase()) : entry.platform; }
function platformLabelOf(entry) { return entry.platform === 'outra' ? (entry.custom_platform_name || 'Outra') : PLATFORM_LABELS[entry.platform]; }

function availablePlatformViews() {
  const map = {};
  periodsForCadence(state.activeCadence).forEach(p => (state.entriesByPeriod[p.id] || []).forEach(e => {
    const key = platformKeyOf(e);
    if (!map[key]) map[key] = platformLabelOf(e);
  }));
  const known = PLATFORM_ORDER.filter(k => map[k]).map(k => ({ key: k, label: map[k] }));
  const custom = Object.keys(map).filter(k => k.startsWith('outra:')).map(k => ({ key: k, label: map[k] })).sort((a, b) => a.label.localeCompare(b.label));
  return [...known, ...custom];
}

/* ---------------- Report computation ---------------- */

function safeDiv(a, b) { return b ? a / b : null; }
function aggregateMarketing(entries) {
  return entries.reduce((acc, e) => ({
    spend: acc.spend + Number(e.spend || 0), impressions: acc.impressions + Number(e.impressions || 0),
    clicks: acc.clicks + Number(e.clicks || 0), leads: acc.leads + Number(e.leads || 0), views: acc.views + Number(e.views || 0),
  }), { spend: 0, impressions: 0, clicks: 0, leads: 0, views: 0 });
}

function computeOverviewDerived(period, agg) {
  const p = {
    spend: agg.spend, leads: agg.leads,
    qualified_leads: period.qualified_leads, meetings_scheduled: period.meetings_scheduled, meetings_held: period.meetings_held,
    proposals: period.proposals, sales: period.sales, revenue: period.revenue,
  };
  return {
    ...p,
    cpl: safeDiv(p.spend, p.leads), cpql: safeDiv(p.spend, p.qualified_leads), cac: safeDiv(p.spend, p.sales),
    avg_ticket: safeDiv(p.revenue, p.sales), roas: safeDiv(p.revenue, p.spend),
    lead_to_qualified: safeDiv(p.qualified_leads, p.leads), qualified_to_meeting: safeDiv(p.meetings_scheduled, p.qualified_leads),
    show_rate: safeDiv(p.meetings_held, p.meetings_scheduled), meeting_to_proposal: safeDiv(p.proposals, p.meetings_held),
    proposal_to_sale: safeDiv(p.sales, p.proposals),
  };
}

function computePlatformDerived(agg) {
  return {
    spend: agg.spend, impressions: agg.impressions, clicks: agg.clicks, leads: agg.leads, views: agg.views,
    cpm: agg.impressions ? agg.spend / agg.impressions * 1000 : null,
    ctr: safeDiv(agg.clicks, agg.impressions), cpc: safeDiv(agg.spend, agg.clicks), cpl: safeDiv(agg.spend, agg.leads),
  };
}

const OVERVIEW_METRIC_DEFS = [
  { key: 'spend', label: 'Investimento', fmt: 'money', direction: 'neutral' },
  { key: 'leads', label: 'Leads', fmt: 'int', direction: 'up' },
  { key: 'qualified_leads', label: 'Leads qualificados', fmt: 'int', direction: 'up' },
  { key: 'meetings_scheduled', label: 'Reuniões marcadas', fmt: 'int', direction: 'up' },
  { key: 'meetings_held', label: 'Reuniões realizadas', fmt: 'int', direction: 'up' },
  { key: 'proposals', label: 'Propostas', fmt: 'int', direction: 'up' },
  { key: 'sales', label: 'Vendas', fmt: 'int', direction: 'up' },
  { key: 'revenue', label: 'Receita', fmt: 'money', direction: 'up' },
  { key: 'cpl', label: 'CPL', fmt: 'money', direction: 'down' },
  { key: 'cpql', label: 'Custo por qualificado', fmt: 'money', direction: 'down' },
  { key: 'cac', label: 'CAC', fmt: 'money', direction: 'down' },
  { key: 'avg_ticket', label: 'Ticket médio', fmt: 'money', direction: 'up' },
  { key: 'roas', label: 'ROAS', fmt: 'x', direction: 'up' },
  { key: 'lead_to_qualified', label: 'Lead → Qualificado', fmt: 'pct', direction: 'up' },
  { key: 'qualified_to_meeting', label: 'Qualificado → Reunião', fmt: 'pct', direction: 'up' },
  { key: 'show_rate', label: 'Show rate', fmt: 'pct', direction: 'up' },
  { key: 'meeting_to_proposal', label: 'Reunião → Proposta', fmt: 'pct', direction: 'up' },
  { key: 'proposal_to_sale', label: 'Proposta → Venda', fmt: 'pct', direction: 'up' },
];

const PLATFORM_METRIC_DEFS = [
  { key: 'spend', label: 'Investimento', fmt: 'money', direction: 'neutral' },
  { key: 'impressions', label: 'Impressões', fmt: 'int', direction: 'neutral' },
  { key: 'views', label: 'Visualizações', fmt: 'int', direction: 'neutral' },
  { key: 'clicks', label: 'Cliques', fmt: 'int', direction: 'up' },
  { key: 'leads', label: 'Leads', fmt: 'int', direction: 'up' },
  { key: 'cpm', label: 'CPM', fmt: 'money', direction: 'down' },
  { key: 'ctr', label: 'CTR', fmt: 'pct', direction: 'up' },
  { key: 'cpc', label: 'CPC', fmt: 'money', direction: 'down' },
  { key: 'cpl', label: 'CPL', fmt: 'money', direction: 'down' },
];

function pctDelta(curr, prev) { if (curr === null || prev === null || prev === 0) return null; return (curr - prev) / prev; }
function semaphore(def, curr, prev) {
  if (def.direction === 'neutral') return 'gray';
  const delta = pctDelta(curr, prev);
  if (delta === null) return 'gray';
  const favorable = def.direction === 'up' ? delta : -delta;
  if (favorable >= 0.05) return 'green';
  if (favorable <= -0.10) return 'red';
  return 'amber';
}

function buildMetricsRows(defs, curr, prev) {
  return defs.map(def => {
    const c = curr[def.key], p = prev ? prev[def.key] : null;
    return { ...def, current: c, previous: p, deltaPct: pctDelta(c, p), status: semaphore(def, c, p) };
  });
}

function buildBullets(c, p) {
  const bullets = [];
  if (!p) { bullets.push('Esse é o primeiro período dessa cadência — cadastre um segundo pra começar a ver comparativos e diagnósticos.'); return bullets; }
  const d = (key) => pctDelta(c[key], p[key]);
  if (d('leads') > 0.10 && d('cpl') < -0.05 && d('lead_to_qualified') < -0.10) bullets.push('Volume de leads subiu e o CPL caiu, mas a taxa de qualificação piorou — sinal de que o volume extra veio com menos qualidade.');
  if (d('leads') > 0.10 && d('meetings_scheduled') < -0.05) bullets.push('Leads subiram mas reuniões marcadas caíram — possível gargalo entre geração de lead e agendamento.');
  if (d('meetings_held') > 0.05 && d('sales') < -0.05) bullets.push('Reuniões realizadas subiram mas vendas caíram — possível deterioração na taxa de fechamento.');
  if (d('spend') > 0.10 && d('revenue') > 0 && d('roas') < -0.10) bullets.push('Investimento e receita subiram, mas o ROAS caiu — a operação escalou volume só que perdeu eficiência.');
  if (d('show_rate') !== null && d('show_rate') <= -0.15) bullets.push('Queda relevante no show rate — vale checar o processo de confirmação de reuniões.');
  if (Math.abs(d('spend') || 0) < 0.05 && d('revenue') > 0.10) bullets.push('Receita subiu sem aumento relevante de investimento — eficiência melhorou, pode ser um bom momento pra escalar orçamento (estimativa, não garantia de que o retorno se mantém em escala maior).');
  if (d('cpl') < -0.05 && d('cac') > 0.10) bullets.push('CPL caiu mas o CAC subiu — o marketing ficou mais barato, mas o comercial está convertendo pior. O problema provável não está no tráfego.');
  if (bullets.length === 0) bullets.push('Nenhum padrão relevante identificado nas regras automáticas — os números se mantiveram relativamente estáveis entre os dois períodos.');
  return bullets;
}

function buildReport() {
  const cadencePeriods = periodsForCadence(state.activeCadence);
  if (cadencePeriods.length === 0) return null;
  const current = cadencePeriods[0];
  const previous = cadencePeriods[1] || null;
  const ascPeriods = cadencePeriods.slice().reverse();

  if (state.activeReportView === 'overview') {
    const currAgg = aggregateMarketing(state.entriesByPeriod[current.id] || []);
    const prevAgg = previous ? aggregateMarketing(state.entriesByPeriod[previous.id] || []) : null;
    const currDerived = computeOverviewDerived(current, currAgg);
    const prevDerived = previous ? computeOverviewDerived(previous, prevAgg) : null;
    const metrics = buildMetricsRows(OVERVIEW_METRIC_DEFS, currDerived, prevDerived || {});
    const bullets = buildBullets(currDerived, prevDerived);
    const trend = ascPeriods.map(p => {
      const agg = aggregateMarketing(state.entriesByPeriod[p.id] || []);
      return { label: p.period_label, spend: agg.spend, leads: agg.leads, sales: p.sales, revenue: p.revenue, roas: safeDiv(p.revenue, agg.spend) };
    });
    const mediaBreakdown = (state.entriesByPeriod[current.id] || []).reduce((acc, e) => {
      const key = platformKeyOf(e); const label = platformLabelOf(e);
      if (!acc[key]) acc[key] = { label, spend: 0 };
      acc[key].spend += Number(e.spend || 0);
      return acc;
    }, {});
    return { viewLabel: 'Visão geral', current, previous, metrics, bullets, trend, mediaBreakdown: Object.values(mediaBreakdown) };
  } else {
    const key = state.activeReportView;
    const label = (availablePlatformViews().find(v => v.key === key) || {}).label || key;
    const currEntries = (state.entriesByPeriod[current.id] || []).filter(e => platformKeyOf(e) === key);
    const prevEntries = previous ? (state.entriesByPeriod[previous.id] || []).filter(e => platformKeyOf(e) === key) : [];
    const currAgg = computePlatformDerived(aggregateMarketing(currEntries));
    const prevAgg = previous ? computePlatformDerived(aggregateMarketing(prevEntries)) : null;
    const metrics = buildMetricsRows(PLATFORM_METRIC_DEFS, currAgg, prevAgg || {});
    const trend = ascPeriods.map(p => {
      const entries = (state.entriesByPeriod[p.id] || []).filter(e => platformKeyOf(e) === key);
      const agg = aggregateMarketing(entries);
      return { label: p.period_label, spend: agg.spend, cpl: safeDiv(agg.spend, agg.leads) };
    });
    return { viewLabel: label, current, previous, metrics, bullets: [], trend, mediaBreakdown: null };
  }
}

function renderViewPills() {
  const views = [{ key: 'overview', label: 'Visão geral' }, ...availablePlatformViews()];
  return `<div class="view-pills">${views.map(v => `<button class="view-pill${state.activeReportView === v.key ? ' active' : ''}" data-view="${v.key}">${escapeHtml(v.label)}</button>`).join('')}</div>`;
}

function destroyCharts() { activeCharts.forEach(c => { try { c.destroy(); } catch (e) {} }); activeCharts = []; }

function makeChart(canvasId, type, labels, datasets) {
  const ctx = document.getElementById(canvasId);
  if (!ctx) return;
  const chart = new Chart(ctx, { type, data: { labels, datasets },
    options: { responsive: true, maintainAspectRatio: false, plugins: { legend: { display: datasets.length > 1 } } } });
  activeCharts.push(chart);
}

function renderReport() {
  const body = document.getElementById('report-body');
  destroyCharts();

  const cadenceBar = `<div id="report-cadence-pills"></div>`;
  const cadencePeriods = periodsForCadence(state.activeCadence);

  if (cadencePeriods.length === 0) {
    body.innerHTML = cadenceBar + '<div class="empty-hint">Nenhum período cadastrado nessa cadência ainda. Cadastre um na aba "Períodos".</div>';
    renderCadencePills('report-cadence-pills', () => renderReport());
    return;
  }

  if (!availablePlatformViews().find(v => v.key === state.activeReportView) && state.activeReportView !== 'overview') state.activeReportView = 'overview';
  const report = buildReport();

  const rows = report.metrics.map(m => {
    const currStr = fmtByType(m.current, m.fmt);
    const prevStr = m.previous !== null && m.previous !== undefined ? fmtByType(m.previous, m.fmt) : '—';
    let deltaStr = '—', deltaClass = 'delta-neutral';
    if (m.deltaPct !== null) { deltaStr = (m.deltaPct >= 0 ? '+' : '') + (m.deltaPct * 100).toFixed(1) + '%'; deltaClass = m.deltaPct >= 0 ? 'delta-pos' : 'delta-neg'; }
    return `<tr><td><span class="dot dot-${m.status}"></span>${m.label}</td><td>${currStr}</td><td>${prevStr}</td><td class="delta ${deltaClass}">${deltaStr}</td></tr>`;
  }).join('');

  let chartsHtml = '';
  if (state.activeReportView === 'overview') {
    chartsHtml = `
      <div class="charts-grid">
        <div class="card-block"><div class="chart-title">Investimento x Receita por período</div><div class="chart-box"><canvas id="chart-spend-revenue"></canvas></div></div>
        <div class="card-block"><div class="chart-title">ROAS por período</div><div class="chart-box"><canvas id="chart-roas"></canvas></div></div>
        <div class="card-block"><div class="chart-title">Leads x Vendas por período</div><div class="chart-box"><canvas id="chart-leads-sales"></canvas></div></div>
        <div class="card-block"><div class="chart-title">Investimento por mídia (período atual)</div><div class="chart-box"><canvas id="chart-media-breakdown"></canvas></div></div>
      </div>`;
  } else {
    chartsHtml = `
      <div class="charts-grid">
        <div class="card-block"><div class="chart-title">Investimento por período</div><div class="chart-box"><canvas id="chart-platform-spend"></canvas></div></div>
        <div class="card-block"><div class="chart-title">CPL por período</div><div class="chart-box"><canvas id="chart-platform-cpl"></canvas></div></div>
      </div>`;
  }

  body.innerHTML = `
    ${cadenceBar}
    ${renderViewPills()}
    <div class="card-block">
      <div class="summary-text"><strong>${escapeHtml(report.viewLabel)}</strong> — <strong>${escapeHtml(report.current.period_label)}</strong>
      ${report.previous ? `comparado a <strong>${escapeHtml(report.previous.period_label)}</strong>` : '— primeiro período dessa cadência, sem comparativo ainda'}.</div>
    </div>
    ${chartsHtml}
    <div class="card-block"><table class="mtable"><thead><tr><th>Métrica</th><th>Atual</th><th>Anterior</th><th>Variação</th></tr></thead><tbody>${rows}</tbody></table></div>
    ${report.bullets.length ? `<div class="section-header"><h3>Pontos de atenção</h3></div><div class="bullets">${report.bullets.map(b => `<div class="bullet">${escapeHtml(b)}</div>`).join('')}</div>` : ''}
  `;

  renderCadencePills('report-cadence-pills', () => renderReport());
  document.querySelectorAll('[data-view]').forEach(btn => btn.addEventListener('click', () => { state.activeReportView = btn.dataset.view; renderReport(); }));

  if (state.activeReportView === 'overview') {
    const labels = report.trend.map(t => t.label);
    makeChart('chart-spend-revenue', 'bar', labels, [
      { label: 'Investimento', data: report.trend.map(t => t.spend), backgroundColor: '#8FA3C7' },
      { label: 'Receita', data: report.trend.map(t => t.revenue), backgroundColor: '#1E8E5A' },
    ]);
    makeChart('chart-roas', 'line', labels, [{ label: 'ROAS', data: report.trend.map(t => t.roas), borderColor: '#14213D', backgroundColor: '#14213D', tension: .25 }]);
    makeChart('chart-leads-sales', 'bar', labels, [
      { label: 'Leads', data: report.trend.map(t => t.leads), backgroundColor: '#8FA3C7' },
      { label: 'Vendas', data: report.trend.map(t => t.sales), backgroundColor: '#B5820A' },
    ]);
    makeChart('chart-media-breakdown', 'bar', report.mediaBreakdown.map(m => m.label), [{ label: 'Investimento', data: report.mediaBreakdown.map(m => m.spend), backgroundColor: '#14213D' }]);
  } else {
    const labels = report.trend.map(t => t.label);
    makeChart('chart-platform-spend', 'bar', labels, [{ label: 'Investimento', data: report.trend.map(t => t.spend), backgroundColor: '#14213D' }]);
    makeChart('chart-platform-cpl', 'line', labels, [{ label: 'CPL', data: report.trend.map(t => t.cpl), borderColor: '#B5820A', backgroundColor: '#B5820A', tension: .25 }]);
  }
}

/* ---------------- Chat ---------------- */

function renderChatEmptyState() {
  const wrap = document.getElementById('chat-messages');
  updateChatContextLabel();
  if (state.chatMessages.length > 0) return;
  wrap.innerHTML = '<div class="chat-empty">Pergunte algo sobre o relatório atual — ex: "por que o CAC subiu?" ou "qual mídia está performando melhor?"</div>';
}

function updateChatContextLabel() {
  const report = buildReport();
  const cadenceLabel = CADENCE_DEFS.find(c => c.key === state.activeCadence).label;
  document.getElementById('chat-context-label').textContent = report ? `Conversando sobre: ${cadenceLabel} · ${report.viewLabel}` : `Cadência: ${cadenceLabel} (cadastre um período pra começar)`;
}

function renderChatMessages() {
  const wrap = document.getElementById('chat-messages');
  if (state.chatMessages.length === 0) { renderChatEmptyState(); return; }
  wrap.innerHTML = '';
  state.chatMessages.forEach(m => { const el = document.createElement('div'); el.className = 'msg msg-' + m.role; el.textContent = m.content; wrap.appendChild(el); });
  wrap.scrollTop = wrap.scrollHeight;
}

async function sendChatMessage() {
  const input = document.getElementById('chat-text-input');
  const text = input.value.trim();
  if (!text) return;
  const report = buildReport();
  if (!report) { alert('Cadastre pelo menos um período antes de conversar sobre o relatório.'); return; }
  const client = state.clients.find(c => c.id === state.activeClientId);

  state.chatMessages.push({ role: 'user', content: text });
  input.value = '';
  renderChatMessages();
  updateChatContextLabel();

  const wrap = document.getElementById('chat-messages');
  const typingEl = document.createElement('div'); typingEl.className = 'msg-typing'; typingEl.textContent = 'Pensando...';
  wrap.appendChild(typingEl); wrap.scrollTop = wrap.scrollHeight;

  const payload = {
    question: text,
    history: state.chatMessages.slice(0, -1),
    clientName: client ? client.name : '',
    cadence: CADENCE_DEFS.find(c => c.key === state.activeCadence).label,
    reportView: report.viewLabel,
    report: {
      periodLabel: report.current.period_label, periodStart: report.current.period_start, periodEnd: report.current.period_end,
      previousPeriodLabel: report.previous ? report.previous.period_label : null,
      metrics: report.metrics.map(m => ({ key: m.key, label: m.label, current: m.current, previous: m.previous, deltaPct: m.deltaPct, status: m.status })),
      bullets: report.bullets,
    },
  };

  try {
    const res = await fetch(N8N_WEBHOOK_URL, { method: 'POST', headers: { 'Content-Type': 'application/json', 'X-Radar-Secret': N8N_WEBHOOK_SECRET }, body: JSON.stringify(payload) });
    typingEl.remove();
    if (!res.ok) throw new Error('status ' + res.status);
    const data = await res.json();
    const reply = data.reply || data.answer || data.output || JSON.stringify(data);
    state.chatMessages.push({ role: 'assistant', content: reply });
  } catch (e) {
    typingEl.remove();
    state.chatMessages.push({ role: 'assistant', content: 'Não consegui falar com o fluxo de IA agora. Confira se a URL do webhook em N8N_WEBHOOK_URL está correta e se o workflow está ativo no n8n.' });
  }
  renderChatMessages();
}

document.getElementById('chat-send-btn').addEventListener('click', sendChatMessage);
document.getElementById('chat-text-input').addEventListener('keydown', (e) => { if (e.key === 'Enter') sendChatMessage(); });

/* ---------------- Formatting ---------------- */

function fmtMoney(v) { return 'R$ ' + Number(v || 0).toLocaleString('pt-BR', { minimumFractionDigits: 2, maximumFractionDigits: 2 }); }
function fmtDate(d) { return d ? new Date(d + 'T00:00:00').toLocaleDateString('pt-BR') : ''; }
function fmtByType(v, type) {
  if (v === null || v === undefined) return '—';
  if (type === 'money') return fmtMoney(v);
  if (type === 'pct') return (v * 100).toFixed(1) + '%';
  if (type === 'x') return v.toFixed(2) + 'x';
  return Math.round(v).toLocaleString('pt-BR');
}
function escapeHtml(str) { if (!str) return ''; return String(str).replace(/[&<>"']/g, (m) => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m])); }

/* ---------------- Modal helpers ---------------- */

function openModal(id) { document.getElementById(id).classList.add('active'); }
function closeModal(id) { document.getElementById(id).classList.remove('active'); }
document.querySelectorAll('[data-close]').forEach(b => b.addEventListener('click', () => closeModal(b.dataset.close)));
document.querySelectorAll('.overlay').forEach(ov => { if (ov.id === 'delete-confirm-modal') return; ov.addEventListener('click', (e) => { if (e.target === ov) ov.classList.remove('active'); }); });

/* ---------------- Delete confirmation (type DELETE) ---------------- */

let deleteConfirmResolve = null;
function confirmDelete(message) {
  return new Promise((resolve) => {
    deleteConfirmResolve = resolve;
    document.getElementById('delete-confirm-message').textContent = message;
    const inp = document.getElementById('delete-confirm-input'); inp.value = '';
    document.getElementById('delete-confirm-btn').disabled = true;
    openModal('delete-confirm-modal');
    setTimeout(() => inp.focus(), 50);
  });
}
function resolveDeleteConfirm(result) { closeModal('delete-confirm-modal'); if (deleteConfirmResolve) { deleteConfirmResolve(result); deleteConfirmResolve = null; } }
document.getElementById('delete-confirm-input').addEventListener('input', (e) => { document.getElementById('delete-confirm-btn').disabled = e.target.value.trim().toLowerCase() !== 'delete'; });
document.getElementById('delete-confirm-input').addEventListener('keydown', (e) => { if (e.key === 'Enter' && !document.getElementById('delete-confirm-btn').disabled) document.getElementById('delete-confirm-btn').click(); });
document.getElementById('delete-confirm-btn').addEventListener('click', () => resolveDeleteConfirm(true));
document.getElementById('delete-confirm-cancel-btn').addEventListener('click', () => resolveDeleteConfirm(false));
document.getElementById('delete-confirm-close-x').addEventListener('click', () => resolveDeleteConfirm(false));
document.getElementById('delete-confirm-modal').addEventListener('click', (e) => { if (e.target.id === 'delete-confirm-modal') resolveDeleteConfirm(false); });
</script>
